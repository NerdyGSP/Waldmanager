name: CI

# Prüft jeden Branch und jeden Pull Request: Typen, Unit-Tests, Build.
# Das Deployment bleibt bei Cloudflare Workers Builds (Push auf main).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefen:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Platzhalter: der Build braucht die Variablen, die echten Werte liegen bei Cloudflare
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_platzhalter
